version: '3.8'

services:
  # =========================================================================
  # 1. MySQL 8.0 Ma'lumotlar Bazasi (Persistent Data + utf8mb4 Charset)
  # =========================================================================
  mysql_db:
    image: mysql:8.0
    container_name: open_budget_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-khurshid-2827}
      MYSQL_DATABASE: open_budget
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - open_budget_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-khurshid-2827}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # 2. NestJS Multi-Bot Orchestrator & React Admin Dashboard
  # =========================================================================
  bot_orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open_budget_orchestrator
    restart: unless-stopped
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      UV_THREADPOOL_SIZE: 128
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-khurshid-2827}@127.0.0.1:3306/open_budget
      
      # Asosiy Birlamchi Bot va Admin Sozlamalari
      BOT_TOKEN: ${BOT_TOKEN:-8973530886:AAFjlBqhJgVaKseHVs1Eved6_ARENGeCAoc}
      ADMIN_PHONE: ${ADMIN_PHONE:-+998901234567}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_password}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-8140304652,2053690211,5957905121}
      
      # Mukofot & To'lov Stavkalari
      VOTE_REWARD: ${VOTE_REWARD:-30000}
      REFERRAL_BONUS: ${REFERRAL_BONUS:-5000}
      MIN_WITHDRAWAL: ${MIN_WITHDRAWAL:-10000}
      
      # Avtomatlashtirish & Tizim Monitoringi (Har 15 daqiqada tekshiruv)
      VOTE_AUTO_APPROVE_HOURS: ${VOTE_AUTO_APPROVE_HOURS:-2}
      HEALTH_CHECK_INTERVAL_MINUTES: ${HEALTH_CHECK_INTERVAL_MINUTES:-15}
      HEALTH_CHECK_ENABLED: ${HEALTH_CHECK_ENABLED:-true}
      
      # Tashqi Servis & Proxy Sozlamalari
      EXTERNAL_VOTING_API_URL: ${EXTERNAL_VOTING_API_URL:-}
      EXTERNAL_VOTING_API_KEY: ${EXTERNAL_VOTING_API_KEY:-}
      EXTERNAL_SERVICE_ENABLED: ${EXTERNAL_SERVICE_ENABLED:-false}
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_LIST: ${PROXY_LIST:-}
    volumes:
      - app_logs:/app/logs
      - app_receipts:/app/public/receipts
      - app_avatars:/app/public/avatars
    network_mode: "host"

# =========================================================================
# Persistent Volumes (Ma'lumotlar, Cheklar va Avatarlar yo'qolmasligi uchun)
# =========================================================================
volumes:
  mysql_data:
    name: open_budget_mysql_data
  app_receipts:
    name: open_budget_receipts_data
  app_avatars:
    name: open_budget_avatars_data
  app_logs:
    name: open_budget_logs_data

networks:
  open_budget_network:
    name: open_budget_network
    driver: bridge
